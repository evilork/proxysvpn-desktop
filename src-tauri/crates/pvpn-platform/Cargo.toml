[package]
name = "pvpn-platform"
version = "0.1.0"
edition = "2021"
description = "Platform layer for ProxysVPN Desktop: elevation, paths, TUN device and route plumbing"
authors = ["ProxysVPN"]
publish = false

# The root helper on its own, for the AppImage (src/bin/proxysvpn-helper.rs).
# The GUI depends on the library only, so building the app does not build it;
# tauri.linux.conf.json does, before the bundle.
[[bin]]
name = "proxysvpn-helper"
path = "src/bin/proxysvpn-helper.rs"

# Deliberately free of tauri/reqwest/rustls so that
#   cargo check -p pvpn-platform --target x86_64-pc-windows-msvc
# works on a machine without the MSVC toolchain (nothing here needs a C
# compiler, unlike `ring`). See scripts/check-platform.sh.
[dependencies]
anyhow = "1"
# The Linux helper protocol. Pure Rust, no build script, no C — so the crate
# still cross-compiles from a Mac, which is the whole point of keeping this
# dependency list short.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util"] }
# A socket pinned to the physical interface before it connects (net/egress.rs).
# Already in the tree through tokio, pure Rust over libc / windows-sys; "all"
# only unlocks the interface-binding calls.
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# One question to the session bus: is there a tray host (tray.rs)? Pure Rust,
# and already in the app through tauri-plugin-opener and the notification
# plugin, so it adds no code to the build and no C to the cross-check.
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
