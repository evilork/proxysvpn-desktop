[package]
name = "proxysvpn-desktop"
version = "0.3.0"
description = "ProxysVPN Desktop"
authors = ["ProxysVPN"]
edition = "2021"

[lib]
name = "proxysvpn_desktop_lib"
# No "cdylib": iOS links the staticlib into the app, and a cdylib build fails
# because the pvpn_* FFI symbols only exist in Swift at Xcode link time.
# Re-add "cdylib" if an Android target ever appears (JNI needs a shared lib).
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
urlencoding = "2"
url = "2"
anyhow = "1"
thiserror = "2"
libc = "0.2"
# Salted network fingerprints for the per-network memory (src/netmem.rs).
sha2 = "0.10"
tauri-plugin-clipboard-manager = "2.3.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Desktop-only: tray icon and shell live outside the iOS sandbox model.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# "Уведомления" (MoreScreen): protection-drop / restored toasts. Desktop-only
# for the same reason as the tray - iOS has no window to hide behind and the
# Network Extension has its own OS-level lifecycle notices.
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# SCDynamicStore: the system resolver pointed into the tunnel (src/sysdns.rs).
core-foundation = "0.10"
