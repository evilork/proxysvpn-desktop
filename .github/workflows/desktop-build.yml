# Builds the desktop app on all three targets and uploads the installers as
# workflow artifacts. Nothing is signed, nothing is published, no secrets are
# used — every step runs on public runner images only.
#
# Runner images:
#   macos-latest    arm64  -> .dmg built by src-tauri/scripts/build-release.sh
#                             (plain `tauri build` produces an .app without the
#                             root launcher, which loops the password window)
#   windows-latest  x86_64 -> NSIS installer
#   ubuntu-22.04    x86_64 -> .deb + AppImage. Pinned to 22.04 on purpose: a
#                             bundle built on 24.04 needs glibc 2.39 and will
#                             not start on 22.04 machines. If GitHub retires
#                             this image, switch to ubuntu-24.04 and rename
#                             libfuse2 -> libfuse2t64 below; the bundles then
#                             require glibc 2.39+.
name: desktop-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS aarch64 (dmg)
            runner: macos-latest
            artifact: proxysvpn-macos-aarch64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows x86_64 (nsis)
            runner: windows-latest
            artifact: proxysvpn-windows-x86_64
            bundles: nsis
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux x86_64 (deb, AppImage)
            runner: ubuntu-22.04
            artifact: proxysvpn-linux-x86_64
            bundles: deb,appimage
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    defaults:
      run:
        # Git Bash on the Windows runner, so every step below is one shell.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            patchelf \
            build-essential \
            file \
            curl \
            wget

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rust toolchain (host target)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Fetch sidecars (xray, tun2socks, hysteria, geo data)
        run: bash scripts/fetch-binaries.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend build (tsc typecheck + vite)
        # Must run before cargo: tauri::generate_context! embeds ../dist at
        # compile time, so the Rust build and the tests need it on disk.
        run: npm run build

      - name: JS tests
        # No-op until a test script exists in package.json.
        run: npm test --if-present

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: bash src-tauri/scripts/build-release.sh

      - name: Bundle (Windows, Linux)
        if: runner.os != 'macOS'
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: List bundle output
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f -print

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
