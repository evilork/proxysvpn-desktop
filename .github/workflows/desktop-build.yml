# Builds the desktop app on all three targets and uploads the installers as
# workflow artifacts. Nothing is signed, nothing is published, no secrets are
# used — every step runs on public runner images only.
#
# Runner images:
#   macos-latest    arm64  -> .dmg built by src-tauri/scripts/build-release.sh
#                             (plain `tauri build` produces an .app without the
#                             root launcher, which loops the password window)
#   windows-latest  x86_64 -> NSIS installer
#   ubuntu-22.04    x86_64 -> .deb + AppImage. Pinned to 22.04 on purpose: a
#                             bundle built on 24.04 needs glibc 2.39 and will
#                             not start on 22.04 machines. If GitHub retires
#                             this image, switch to ubuntu-24.04 and rename
#                             libfuse2 -> libfuse2t64 below; the bundles then
#                             require glibc 2.39+.
name: desktop-build

on:
  workflow_dispatch:
  # main is built too. Without this a merge is never compiled or bundled and a
  # breakage only surfaces on the next pull request — which is exactly how a
  # merged main could sit unverified, and did once in this branch's history.
  push:
    branches: [main]
    # Kept in step with the pull_request list below. GitHub Actions does not
    # support YAML anchors, so the two have to be edited together.
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "public/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "public/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS aarch64 (dmg)
            runner: macos-latest
            artifact: proxysvpn-macos-aarch64
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows x86_64 (nsis)
            runner: windows-latest
            artifact: proxysvpn-windows-x86_64
            bundles: nsis
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux x86_64 (deb, AppImage)
            runner: ubuntu-22.04
            artifact: proxysvpn-linux-x86_64
            bundles: deb,appimage
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    defaults:
      run:
        # Git Bash on the Windows runner, so every step below is one shell.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            patchelf \
            build-essential \
            file \
            curl \
            wget \
            iproute2

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rust toolchain (host target)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Fetch sidecars (xray, tun2socks, hysteria, geo data)
        run: bash scripts/fetch-binaries.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend build (tsc typecheck + vite)
        # Must run before cargo: tauri::generate_context! embeds ../dist at
        # compile time, so the Rust build and the tests need it on disk.
        run: npm run build

      - name: JS tests
        # No-op until a test script exists in package.json.
        run: npm test --if-present

      - name: Rust lints
        run: cargo clippy --workspace --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        # --workspace, or the platform crate's tests (the bulk of them) are skipped.
        run: cargo test --locked --workspace --manifest-path src-tauri/Cargo.toml

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: bash src-tauri/scripts/build-release.sh

      - name: Bundle (Windows, Linux)
        if: runner.os != 'macOS'
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: List bundle output with checksums
        # The checksums go into the log on purpose: nothing here is signed, so a
        # sha256 printed by the very run that produced the file is the only way
        # for whoever downloads the artifact to tell they got that build.
        # SmartScreen cannot help them and neither can we, until there is a
        # code-signing certificate.
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f -print
          echo "--- sha256 ---"
          # macOS ships shasum, Git Bash on the Windows runner ships only
          # sha256sum, Ubuntu has both. Pick whichever is actually there.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256() { sha256sum "$@"; }
          else
            sha256() { shasum -a 256 "$@"; }
          fi
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -print0 | while IFS= read -r -d '' f; do sha256 "$f"; done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  # Why this exists even though the matrix above builds all three platforms: it
  # runs scripts/check-platform.sh, the script a developer runs on their Mac, so
  # the two cannot drift. It used to re-implement a subset of the script by hand
  # and silently omitted two of its steps; now it invokes the script itself, and
  # the list of cross-compiled targets lives in one place.
  cross-check:
    name: Platform layer, cross-compiled
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain with the Windows and Linux targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc x86_64-unknown-linux-gnu
          rustc --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cross-check

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Fetch sidecars (xray, tun2socks, hysteria, geo data)
        # The script runs the GUI crate's checks, whose build script is
        # tauri_build::try_build — it copies the externalBin sidecars and fails
        # if they are absent. On a developer's Mac they are already there, which
        # is precisely the kind of difference this job exists to catch.
        run: bash scripts/fetch-binaries.sh

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend build (tsc typecheck + vite)
        # Same reason: tauri::generate_context! embeds ../dist at compile time.
        run: npm run build

      - name: scripts/check-platform.sh
        run: bash scripts/check-platform.sh
