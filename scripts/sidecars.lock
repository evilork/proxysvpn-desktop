# scripts/sidecars.lock
#
# Pinned sidecar releases and the sha256 of every release asset we download.
# Pinned, not "latest": a build must produce the same engines tomorrow as today,
# and an xray bump is a decision (newer cores have changed REALITY behaviour on
# our fleet before), not something a fresh clone should do silently.
#
# Where the hashes come from:
#   xray      — the per-asset `<asset>.dgst` published next to each release asset
#               (field SHA2-256), fetched 2026-10-01.
#   hysteria  — `hashes.txt` published in the release, fetched 2026-10-01.
#   tun2socks — upstream publishes no checksums, so these are ours: computed
#               from the downloaded assets on 2026-10-01 and pinned here. That
#               is the whole point of this file — the first download is trusted,
#               every later one is verified against it.
#
# Bumping a version: change the tag, run
#   scripts/fetch-binaries.sh --refresh-lock --target <triple>
# for each target, paste the printed lines, and review the diff.

tag xray v26.3.27
tag tun2socks v2.7.0
tag hysteria app/v2.12.3

