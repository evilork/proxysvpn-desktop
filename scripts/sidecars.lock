# scripts/sidecars.lock
#
# Pinned sidecar releases and their SHA-256 sums. Read by scripts/fetch-binaries.sh.
#
# Why a lock file: the previous script downloaded `.../releases/latest/...`, so
# two machines (or two CI runs a week apart) could ship different engines from
# the same commit. Tags make the build reproducible and the hashes make a
# tampered or truncated download fail loudly instead of producing a binary that
# misbehaves at runtime.
#
# Where the hashes come from:
#   xray      — the `<asset>.dgst` file published next to each release asset
#               (SHA2-256 line).
#   hysteria  — `hashes.txt` published with the release.
#   wintun    — the SHA2-256 printed on wintun.net/builds.
#   tun2socks — NOT published by the project. Computed from the downloaded
#               archive on 2026-10-01 and pinned here; that is what makes the
#               pin meaningful, but it is trust-on-first-use, not a signature.
#
# Versions are the ones already shipping on macOS (xray 26.3.27, tun2socks
# 2.6.0, hysteria 2.9.3), so pinning does not change the macOS build. Bumping
# any of them is a separate, deliberate change.
#
# Columns: <tool> <platform> <tag> <asset> <sha256>

